[package]
name = "wuwa-downloader"
version = "0.2.1"
edition = "2024"
build = "build.rs"

[dependencies]
async-channel = "2.5.0"
colored = "3.0.0"
md-5 = "0.10.6"
sha1 = "0.10.6"
aes = "0.8.4"
cbc = "0.1.2"
base64 = "0.22.1"
reqwest = { version = "0.13.1", features = ["json", "stream", "gzip"] }
serde_json = "1.0.149"
serde = { version = "1.0.228", features = ["derive"] }
ctrlc = "3.5.1"
shellexpand = "3.1.1"
flate2 = "1.1.8"
indicatif = "0.18.3"
tokio = { version = "1.49.0", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "process"] }

[target.'cfg(windows)'.dependencies]
winconsole = "0.11.1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[profile.release]
strip = true
lto = true
opt-level = 3
codegen-units = 1
